name: Python Playwright Tests

on:
  push:
    branches: [main, master, test_branch, sauce_demo_automation, playwright-framework]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install
      - name: Run tests
        run: |
          pytest --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html

      - name: Upload HTML report and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/report.html
            reports/junit.xml
            reports/screenshots
